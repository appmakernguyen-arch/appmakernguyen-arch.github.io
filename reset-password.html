'use strict';
const config=window.NTV_CONFIG||{},parameters=new URLSearchParams(location.hash.slice(1));
let token=parameters.get('access_token');const kind=parameters.get('type');history.replaceState(null,'',location.pathname);
const status=document.querySelector('#status'),button=document.querySelector('#save');
